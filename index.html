<!DOCTYPE html>
<html lang="pt-BR" data-theme="midnight">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuitarPicker</title>
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles/themes.css" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark"><img src="icons/logo.svg" alt="GuitarPicker" width="34" height="34" style="display:block;border-radius:8px" /></div>
        <div class="brand-text">
          <strong>GuitarPicker</strong>
          <span>aprenda · toque · evolua</span>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div id="io-indicator" class="io-indicator" title="Dispositivos de entrada e saída">
          <span class="io-row"><span class="io-dot in"></span><span data-io="in">sem microfone</span></span>
          <span class="io-row"><span class="io-dot out"></span><span data-io="out">saída padrão</span></span>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div id="crumb"></div>
        <div class="topbar-right">
          <div id="health-mini" class="health-mini hidden" title="Vida"></div>
          <a id="coin-chip" class="coin-chip" href="#/locker" title="Moedas — ganhe tocando e gaste no Armário">🪙 <b>0</b></a>
          <select id="theme-quick" title="Tema"></select>
        </div>
      </header>
      <section id="view"><!-- active view renders here --></section>
    </main>
  </div>

  <div id="toast-host"></div>

  <script type="module" src="src/app.js"></script>
  <script>
    // PWA: enables install + offline; skipped on file:// where SW is unavailable
    if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
      navigator.serviceWorker.register("sw.js");
  </script>
</body>
</html>
